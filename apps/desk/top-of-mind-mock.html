<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top of Mind — One Inbox for Every AI</title>
<style>
  :root{
    --bg:#04060a; --panel:#0a0f18; --panel2:#0e1622; --panel3:#121d2e; --line:#1d2a3e;
    --text:#d7e2f2; --muted:#7d90ac; --faint:#48597544; --faint2:#485975;
    --blue:#4d8fe0; --gold:#d4af37; --teal:#26b8a6; --rose:#e05ea8;
    --green:#2ebd87; --amber:#e0a53a; --red:#ff5a6a; --violet:#8b6fe8; --cursor:#f0883e;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);
    background:radial-gradient(ellipse at 20% -5%,rgba(77,143,224,.10),transparent 55%),var(--bg);
    display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  .mono{font-family:'JetBrains Mono',Consolas,monospace}

  /* ── top bar ── */
  .top{display:flex;align-items:center;gap:16px;padding:0 18px;height:54px;
    border-bottom:1px solid var(--line);background:rgba(4,6,10,.85);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .mk{color:var(--gold);font:600 22px/1 Georgia,serif}
  .brand .nm{font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .walls{display:flex;gap:4px;margin-left:8px}
  .wall{border:1px solid transparent;border-radius:7px;padding:6px 12px;color:var(--muted);
    font:600 12px Inter,sans-serif;cursor:pointer}
  .wall.on{color:var(--blue);border-color:rgba(77,143,224,.35);background:rgba(77,143,224,.12)}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
    border-radius:9px;background:var(--panel2);padding:7px 12px;width:280px}
  .search input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:13px Inter,sans-serif}
  .search input::placeholder{color:var(--faint2)}
  .endall{border:1px solid rgba(255,90,106,.4);color:var(--red);background:rgba(255,90,106,.08);
    border-radius:8px;padding:7px 12px;font:600 11px Inter,sans-serif;cursor:pointer}

  /* ── 3-col body ── */
  .grid{display:grid;grid-template-columns:230px 1fr 300px;height:100%;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.mid{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .colhead{padding:12px 16px 8px;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint2)}
  .scroll{overflow:auto;padding:0 12px 16px}

  /* ── sources sidebar ── */
  .src{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;margin-bottom:2px}
  .src:hover{background:rgba(255,255,255,.03)}
  .src.on{background:rgba(77,143,224,.12);border-color:rgba(77,143,224,.3)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--c,var(--muted));box-shadow:0 0 8px var(--c,var(--muted))}
  .src .nm{flex:1;font-size:13px;font-weight:600}
  .src .nm small{display:block;color:var(--faint2);font-weight:400;font-size:10px}
  .src.muted{opacity:.45}
  .cnt{background:var(--panel3);color:var(--muted);border-radius:999px;font:700 10px/1 'JetBrains Mono',monospace;padding:3px 7px}
  .cnt.hot{background:var(--amber);color:#04060a}

  /* ── message stream ── */
  .msg{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 15px;margin:10px 0}
  .msg.pinned{border-color:rgba(212,175,55,.35);background:linear-gradient(180deg,rgba(212,175,55,.05),transparent)}
  .mhead{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .avatar{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;
    font:800 10px 'JetBrains Mono',monospace;color:#04060a;background:var(--c,var(--muted))}
  .who{font-size:13px;font-weight:700}
  .role{font:700 8px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
  .time{margin-left:auto;color:var(--faint2);font:11px 'JetBrains Mono',monospace}
  .mbody{font-size:14px;line-height:1.6;color:var(--text)}
  .mbody.diag{border-left:2px solid var(--amber);padding-left:11px;color:var(--muted);font-size:13px}
  .mbody code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold)}
  .mmeta{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .tag{font:700 9px 'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--faint2)}
  .tag.pend{color:var(--amber);border-color:rgba(224,165,58,.4)}
  .tag.deliv{color:var(--green);border-color:rgba(46,189,135,.4)}
  .mact{display:flex;gap:6px;margin-top:9px}
  .ma{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;
    padding:5px 9px;font:600 10px Inter,sans-serif;cursor:pointer}
  .ma:hover{color:var(--text);border-color:var(--blue)}

  /* ── compose ── */
  .compose{border-top:1px solid var(--line);padding:12px 14px;background:var(--panel)}
  .to{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
  .to span{color:var(--faint2);font-size:11px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted);cursor:pointer}
  .chip:hover{color:var(--text)}
  .chip.on{color:#04060a;background:var(--c,var(--blue));border-color:transparent;font-weight:700}
  .cbox{display:flex;gap:10px;align-items:flex-end}
  .cbox textarea{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:11px 13px;font:14px Inter,sans-serif;resize:none;height:48px}
  .gate{display:flex;flex-direction:column;gap:6px}
  .send{border:1px solid rgba(46,189,135,.5);color:var(--green);background:rgba(46,189,135,.1);
    border-radius:9px;padding:9px 18px;font:700 12px Inter,sans-serif;cursor:pointer;white-space:nowrap}
  .send:hover{background:rgba(46,189,135,.2)}
  .hold{border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:9px;
    padding:7px 18px;font:600 11px Inter,sans-serif;cursor:pointer}

  /* ── right: review queue ── */
  .rev{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:12px;margin:8px 0}
  .rev .rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .rev .rt{font-size:12px;font-weight:700;flex:1}
  .rev .rb{color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:10px}
  .rev .rb code{font-family:'JetBrains Mono',monospace;color:var(--gold);font-size:11px}
  .rev .rg{display:flex;gap:6px}
  .rg button{flex:1;border-radius:7px;padding:7px 0;font:700 11px Inter,sans-serif;cursor:pointer;border:1px solid}
  .ap{color:var(--green);border-color:rgba(46,189,135,.4);background:rgba(46,189,135,.08)}
  .ap:hover{background:rgba(46,189,135,.18)}
  .rj{color:var(--red);border-color:rgba(255,90,106,.4);background:rgba(255,90,106,.06)}
  .df{color:var(--muted);border-color:var(--line);background:transparent}
  .empty{color:var(--faint2);font-size:12px;text-align:center;padding:22px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel3);
    border:1px solid var(--green);color:var(--green);border-radius:9px;padding:10px 18px;
    font:600 13px Inter,sans-serif;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="mk">◧</span><span class="nm">Top&nbsp;of&nbsp;Mind</span></div>
    <div class="walls">
      <div class="wall on" data-wall="all">All</div>
      <div class="wall" data-wall="main">Main</div>
      <div class="wall" data-wall="code">Code</div>
    </div>
    <div class="search">
      <span style="color:var(--faint2)">⌕</span>
      <input id="q" placeholder="Search the stream…">
    </div>
    <button class="endall" onclick="toast('Sent end-all to every source')">◼ End all</button>
  </div>

  <div class="grid">
    <!-- LEFT: sources -->
    <div class="col">
      <div class="colhead">Sources</div>
      <div class="scroll" id="srcList"></div>
    </div>

    <!-- MID: stream + compose -->
    <div class="col mid">
      <div class="colhead" id="streamHead">All sources · shared stream</div>
      <div class="scroll" id="stream" style="flex:1"></div>
      <div class="compose">
        <div class="to"><span>Send to:</span><div id="toChips"></div></div>
        <div class="cbox">
          <textarea id="reply" placeholder="Type once — it routes out to the selected AI through the hub…"></textarea>
          <div class="gate">
            <button class="send" onclick="doSend()">Send ▸</button>
            <button class="hold" onclick="toast('Held — nothing sent')">Don't send</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: review queue -->
    <div class="col">
      <div class="colhead">Review queue · the gate</div>
      <div class="scroll" id="revList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const SRC=[
  {id:'claude', nm:'Claude', kind:'Opus 4.8', c:'#d4af37', n:2, on:true},
  {id:'gemini', nm:'Gemini', kind:'2.5 Pro', c:'#4d8fe0', n:1},
  {id:'cursor', nm:'Cursor', kind:'agent', c:'#f0883e', n:0},
  {id:'kimmy', nm:'Kimmy', kind:'CLI', c:'#26b8a6', n:3},
  {id:'codex', nm:'Codex', kind:'referee', c:'#8b6fe8', n:0},
  {id:'folder-agent', nm:'Folder Agent', kind:'watcher', c:'#e0a53a', n:1},
  {id:'clipboard', nm:'Clipboard', kind:'AHK', c:'#e05ea8', n:0, muted:true},
];
const MSG=[
  {src:'claude', role:'assistant', t:'2m', pin:true, body:'Round 1 header contest: my entry won on best-fit. Clipboard subsystem + folder agent are built and tested. Want me to wire the approve gate to <code>/reviews</code> next?'},
  {src:'kimmy', role:'assistant', t:'5m', body:'Labeling lane ready for verification — 50 data-slots across the assigned pages, JSON valid. Handing to Claude to cross-check.'},
  {src:'folder-agent', role:'assistant', t:'8m', diag:true, body:'Diagnosed <code>D:\\...\\PICS</code> — risk <b style="color:#e0a53a">HIGH</b> · symptoms: media_dump, duplicate_cluster · plan: snapshot → hash → separate → approve', tags:['folder_diagnosis','blocked: delete_without_hash']},
  {src:'gemini', role:'assistant', t:'12m', body:'Topbar injection done on my 90 pages, scoped CSS verified, no duplicate legacy headers. Verified by Kimmy.'},
  {src:'kimmy', role:'user', t:'15m', out:true, body:'Route to Kimmy: re-run the unknown-token queue on logos-papers.', deliv:'pending'},
  {src:'codex', role:'assistant', t:'20m', body:'Referee pass queued — waiting on all four lane reports before final verdict.'},
];
const REVIEWS=[
  {t:'Command line', b:'<code>git status</code> in Top-of-Mind-API — requested by AHK bridge.', from:'operator'},
  {t:'Rename', b:'<code>Untitled(3).md</code> → <code>master-equation-nodrift_TP.MQ_000147.md</code> · 91%', from:'folder-agent'},
  {t:'File move', b:'Move 6 media files into <code>PICS\\screenshots\\</code> after hash check.', from:'folder-agent'},
];

let wall='all', active=null, target='claude';

function initial(nm){return nm[0]}
function renderSrc(){
  document.getElementById('srcList').innerHTML=SRC.map(s=>
    `<div class="src ${s.muted?'muted':''} ${active===s.id?'on':''}" data-id="${s.id}" style="--c:${s.c}">
      <span class="dot"></span>
      <span class="nm">${s.nm}<small>${s.kind}${s.muted?' · muted':''}</small></span>
      ${s.n?`<span class="cnt ${s.n>1?'hot':''}">${s.n}</span>`:''}
    </div>`).join('');
  document.querySelectorAll('.src').forEach(el=>el.onclick=()=>{active=active===el.dataset.id?null:el.dataset.id;renderSrc();renderStream();});
}
function renderStream(){
  const head=document.getElementById('streamHead');
  head.textContent = active ? (SRC.find(s=>s.id===active).nm+' · filtered') : 'All sources · shared stream';
  const q=document.getElementById('q').value.toLowerCase();
  const list=MSG.filter(m=>!active||m.src===active).filter(m=>!q||m.body.toLowerCase().includes(q));
  document.getElementById('stream').innerHTML=list.map(m=>{
    const s=SRC.find(x=>x.id===m.src)||{nm:m.src,c:'#7d90ac'};
    return `<div class="msg ${m.pin?'pinned':''}">
      <div class="mhead">
        <span class="avatar" style="--c:${s.c}">${initial(s.nm)}</span>
        <span class="who">${s.nm}</span>
        <span class="role">${m.out?'→ outbound':m.role}</span>
        <span class="time">${m.t}</span>
      </div>
      <div class="mbody ${m.diag?'diag':''}">${m.body}</div>
      ${(m.tags||m.deliv)?`<div class="mmeta">
        ${m.deliv?`<span class="tag pend">delivery: ${m.deliv}</span>`:''}
        ${(m.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      <div class="mact">
        <button class="ma" onclick="toast('${m.pin?'Unpinned':'Pinned'}')">${m.pin?'★ pinned':'☆ pin'}</button>
        <button class="ma" onclick="target='${m.src}';renderTo();toast('Replying to ${s.nm}')">↩ reply</button>
        <button class="ma" onclick="toast('Added to combine set')">⧉ combine</button>
      </div>
    </div>`}).join('') || '<div class="empty">Nothing here.</div>';
}
function renderTo(){
  document.getElementById('toChips').innerHTML=SRC.filter(s=>s.kind!=='AHK'&&s.id!=='folder-agent').map(s=>
    `<div class="chip ${target===s.id?'on':''}" data-id="${s.id}" style="--c:${s.c}">${s.nm}</div>`).join('');
  document.querySelectorAll('.to .chip').forEach(el=>el.onclick=()=>{target=el.dataset.id;renderTo();});
}
function doSend(){
  const t=document.getElementById('reply').value.trim();
  const nm=SRC.find(s=>s.id===target).nm;
  if(!t){toast('Type a message first');return;}
  MSG.unshift({src:target, role:'user', t:'now', out:true, body:t, deliv:'pending'});
  document.getElementById('reply').value='';
  renderStream(); toast('Queued to '+nm+' — pending delivery');
}
function renderRev(){
  const el=document.getElementById('revList');
  if(!REVIEWS.length){el.innerHTML='<div class="empty">Queue clear ✓<br>Nothing waiting on you.</div>';return;}
  el.innerHTML=REVIEWS.map((r,i)=>
    `<div class="rev"><div class="rh"><span class="rt">${r.t}</span><span class="tag">${r.from}</span></div>
      <div class="rb">${r.b}</div>
      <div class="rg">
        <button class="ap" onclick="resolve(${i},'Approved')">Approve</button>
        <button class="rj" onclick="resolve(${i},'Rejected')">Reject</button>
        <button class="df" onclick="resolve(${i},'Deferred')">Defer</button>
      </div></div>`).join('');
}
function resolve(i,verb){ toast(verb+': '+REVIEWS[i].t); REVIEWS.splice(i,1); renderRev(); }

document.querySelectorAll('.wall').forEach(w=>w.onclick=()=>{
  wall=w.dataset.wall; document.querySelectorAll('.wall').forEach(x=>x.classList.toggle('on',x===w)); renderStream();});
document.getElementById('q').addEventListener('input',renderStream);

let tT; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1700);}

renderSrc();renderStream();renderTo();renderRev();
</script>
</body>
</html>
