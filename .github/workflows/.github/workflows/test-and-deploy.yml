name: Test and Deploy

on:
  push:
    branches: [OBS-Plugin-Final-Claude]

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd apps/api
          python -m pytest tests/ -v

  deploy:
    name: Deploy to Windows Server
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install/update dependencies
        run: |
          cd apps/api
          python -m pip install -e ".[dev]"

      - name: Restart API
        shell: powershell
        run: |
          cd apps/api
          $proc = Get-Process python -ErrorAction SilentlyContinue
          if ($proc) { Stop-Process -Name python -Force }
          Start-Process py -ArgumentList "-3.12 -m file_intelligence_hub.api.main --host 0.0.0.0 --port 10000" -WindowStyle Hidden
